name: UI Visual Regression

on:
  pull_request:
    paths:
      - 'packages/ui/**'
      - 'apps/mobile/.rnstorybook/**'

permissions:
  contents: read

jobs:
  chromatic:
    name: Chromatic Visual Tests
    runs-on: ubuntu-latest
    env:
      # `secrets` isn't in the allowed-context list for `if:` (actionlint:
      # "context 'secrets' is not allowed here") -- every push to every
      # branch has been failing this entire workflow file at 0 jobs since
      # d8ce037 introduced the direct `secrets.*` reference in the step
      # `if:` below. Routing it through `env:` first (which *is* allowed in
      # `if:`) is the standard fix.
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package
        run: pnpm --filter @breeyo/ui build

      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        # Pinned to the commit `latest` resolved to on 2026-08-28 (v18.6.1),
        # not the mutable `@latest` tag -- supply-chain hardening so a
        # future upstream compromise of that tag can't silently run in CI.
        uses: chromaui/action@69be7d88fc9479eedbe5b2861f847eb48f97cabc # v18.6.1
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/mobile
          buildScriptName: build:storybook
          onlyChanged: true
          exitZeroOnChanges: true
          exitOnceUploaded: true
