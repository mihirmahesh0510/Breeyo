name: Deploy to Staging

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @breeyo/api db:generate

      - name: Build
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/breeyo-api:$IMAGE_TAG -f apps/api/Dockerfile .
          docker push $ECR_REGISTRY/breeyo-api:$IMAGE_TAG

      - name: Render ECS task definition
        id: render-task-def
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -euo pipefail

          # PUBLIC_API_URL builds the per-clinic Razorpay webhook URL shown to
          # Admins (BIL-06). It must be the externally reachable API origin,
          # which is exactly the host the health check below already probes.
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL is empty - cannot render PUBLIC_API_URL" >&2
            exit 1
          fi

          jq --arg IMAGE "$ECR_REGISTRY/breeyo-api:$IMAGE_TAG" \
             --arg PUBLIC_API_URL "$STAGING_URL" \
            '.containerDefinitions[0].image = $IMAGE
             | .containerDefinitions[0].environment |= map(
                 if .name == "PUBLIC_API_URL" then .value = $PUBLIC_API_URL else . end
               )' \
            infra/aws/staging/api-task-definition.json > task-definition.json

          # A leftover PLACEHOLDER would deploy a plausible-but-wrong webhook URL
          # that fails silently at Razorpay delivery time. Fail loudly instead.
          if grep -q 'PLACEHOLDER' task-definition.json; then
            echo "Unrendered PLACEHOLDER remains in task-definition.json:" >&2
            grep -n 'PLACEHOLDER' task-definition.json >&2
            exit 1
          fi

      - name: Register ECS task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --region ap-south-1 \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task-def-arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        env:
          ECS_CLUSTER: ${{ secrets.ECS_STAGING_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_STAGING_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition ${{ steps.register-task-def.outputs.task-def-arn }} \
            --region ap-south-1

      - name: Wait for service stability
        env:
          ECS_CLUSTER: ${{ secrets.ECS_STAGING_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_STAGING_SERVICE }}
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region ap-south-1

      - name: Health check
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1
